services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      SIGNALING_PORT: 3001
      DATABASE_PATH: /app/data/interview-room.db
    volumes:
      - interview_data:/app/data
    expose:
      - "3000"
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  interview_data:
  caddy_data:
  caddy_config:
